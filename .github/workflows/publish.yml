name: Publish

on:
  # Trigger: pushing a tag like `v0.1.2`, `v1.0.0`, etc.
  # The tag is created manually after the sync-spec PR (or any release PR)
  # is merged.
  push:
    tags: ['v*']

  # Manual trigger — for re-publishing after a hand-fix.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write      # for creating a GitHub release
      id-token: write      # for npm provenance (signed package)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify package version matches tag
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # Image of the hosted HTTP endpoint, tagged with the same version as the npm
  # package. The cluster pins this tag in its manifests and rolls it out from
  # there, so this public repository holds no cluster credentials.
  image:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/statuser-mcp:${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME#v}" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "Pushed $IMAGE" >> "$GITHUB_STEP_SUMMARY"

  # Listing in the official MCP registry (registry.modelcontextprotocol.io):
  # the npm package and the hosted endpoint in one entry. GitHub OIDC proves
  # the io.github.statuser-cloud namespace, so no registry secret is stored.
  registry:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      MCP_PUBLISHER_VERSION: v1.8.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          BASE="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          ARCHIVE="mcp-publisher_linux_amd64.tar.gz"
          curl -sfL -O "$BASE/$ARCHIVE" -O "$BASE/registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          grep " ${ARCHIVE}\$" "registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt" | sha256sum -c -
          tar xzf "$ARCHIVE" mcp-publisher

      # The registry reads mcpName from the published package, and a fresh
      # version takes a few minutes to show up on the npm registry.
      - name: Wait for the npm version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 40); do
            if curl -sf "https://registry.npmjs.org/@statuser/mcp/$VERSION" >/dev/null; then
              echo "npm has $VERSION"; exit 0
            fi
            sleep 15
          done
          echo "::error::@statuser/mcp@$VERSION is not on npm after 10 minutes"
          exit 1

      - name: Publish to the MCP registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
